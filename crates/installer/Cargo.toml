[package]
name = "flinch-installer"
version = "1.2.1"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
native-instance = ["dep:windows", "dep:anyhow", "dep:tracing"]
ui = ["native-instance", "dep:slint", "dep:slint-build", "dep:winresource", "dep:png", "dep:serde_json", "dep:raw-window-handle", "dep:tracing-subscriber"]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "renderer-software", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = { version = "0.6", optional = true }
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_Security"] }
png = { version = "0.18", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }
winresource = { version = "0.1.31", optional = true }

[[bin]]
name = "flinch-installer"
path = "src/main.rs"
required-features = ["ui"]
test = false
bench = false
