[package]
name = "flinch-settings"
version = "1.2.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false
autobins = false

[features]
default = []
ui = ["dep:slint", "dep:slint-build", "dep:raw-window-handle", "dep:windows", "dep:winresource", "dep:png"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-skia", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = { version = "0.6", optional = true }
png = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Controls"] }

[build-dependencies]
serde_json = "1.0"
slint-build = { version = "=1.18.1", optional = true }
winresource = { version = "0.1", optional = true }

[dev-dependencies]
# The test platform has no native window, clipboard, input or event-loop backend.
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software"] }

[[example]]
name = "settings-probe"
path = "examples/settings_probe.rs"
required-features = ["ui"]
