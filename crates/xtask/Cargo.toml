[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
regex = "1.13"
serde_json = "1.0"
sha1 = "0.11"
resvg = "0.50"
image = { version = "0.25", default-features = false, features = ["png"] }
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
